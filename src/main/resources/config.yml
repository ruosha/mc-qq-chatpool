  reload.done: "<green>配置已重新加载。"
  pool.not-found: "<red>没有找到聊天池 <white>{pool}</white><red>，用 <white>/chatpool list</white> 看看有哪些。"
  pool.invalid-name: "<red>聊天池名不合法：只能用字母、数字、下划线和短横线，且以字母或数字开头（最长 32 字符）。"
  pool.empty-message: "<red>消息内容不能为空。"
  pool.too-long: "<red>消息太长了（最多 <white>{max}</white> 个字符）。"
  pool.too-fast: "<red>说得太快了，请等 <white>{ms}</white> 毫秒后再发。"
  pool.mc-disabled: "<red>聊天池 <white>{pool}</white><red> 不允许游戏内发言。"
  pool.sent: "<dark_gray>已发送到聊天池 <white>{pool}</white><dark_gray>（#<white>{id}</white><dark_gray>）"
  pool.joined: "<green>已订阅聊天池 <white>{pool}</white><green>，之后会看到这个池的消息。"
  pool.already-joined: "<gray>你已经在聊天池 <white>{pool}</white><gray> 里了。"
  pool.left: "<yellow>已退出聊天池 <white>{pool}</white><yellow>。"
  pool.not-joined: "<gray>你并没有订阅聊天池 <white>{pool}</white><gray>。"
  pool.list-header: "<gray>聊天池（<white>{count}</white> 个）："
  pool.list-entry: "<gray> - <white>{pool}</white> <dark_gray>(</dark_gray><aqua>{display}</aqua><dark_gray>)</dark_gray> <gray>在线 <white>{online}</white>/订阅 <white>{members}</white>/历史 <white>{history}</white>{flags}"
  pool.info-header: "<gray>聊天池 <white>{pool}</white> <dark_gray>({display})</dark_gray>"
  pool.info-line: "<gray>  {key}<dark_gray>:</dark_gray> <white>{value}"
  pool.history-header: "<gray>聊天池 <white>{pool}</white> 最近 <white>{count}</white> 条消息："
  pool.history-entry: "<dark_gray>#<white>{id}</white> <gray>[</gray><yellow>{source}</yellow><gray>]</gray> <white>{sender}</white><gray> » </gray><white>{content}</white>"
  pool.history-empty: "<gray>聊天池 <white>{pool}</white><gray> 还没有消息。"
  pool.who-header: "<gray>聊天池 <white>{pool}</white> 的在线成员（<white>{count}</white>）："
  pool.who-entry: "<gray> - <white>{player}"
  pool.who-empty: "<gray>聊天池 <white>{pool}</white><gray> 目前没有在线成员。"
  join-hint: "<gray>输入 <white>/chatpool help</white> 查看聊天池用法，用 <white>/chatpool say <文本></white> 把消息发到群里。"
  help: "<gray>聊天池命令：<newline><white>/chatpool list <gray>- 列出所有聊天池<newline><white>/chatpool say <文本> <gray>- 发到默认聊天池<newline><white>/chatpool send <池> <文本> <gray>- 发到指定聊天池<newline><white>/chatpool join <池> <gray>- 订阅一个聊天池<newline><white>/chatpool leave <池> <gray>- 退订一个聊天池<newline><white>/chatpool info <池> <gray>- 查看聊天池详情<newline><white>/chatpool history <池> [条数] <gray>- 查看历史消息<newline><white>/chatpool who <池> <gray>- 查看池内在线成员<newline><white>/chatpool reload <gray>- 重载配置（管理员）<newline><gray>别名：<white>/mcpool<gray>、<white>/mcchat<gray>、<white>/cpool"
