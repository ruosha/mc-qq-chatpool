name: build

on:
  push:
    branches: [ main, maven ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build the plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: ./mvnw -B package

      - name: Upload the plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: mc-qq-chatpool
          path: target/mc-qq-chatpool-*.jar
          if-no-files-found: error

  release:
    name: Attach the jar to the GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      # 复用 build job 已经打好的 jar，不再重新编译一遍
      - name: Download the jar built by the build job
        uses: actions/download-artifact@v4
        with:
          name: mc-qq-chatpool
          path: target

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            target/mc-qq-chatpool-*.jar
